    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Docverse",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Any (navigateur web) - service gere, heberge en France",
        "description": "Docverse est une solution cloud RAG souveraine : vos documents (PDF, scans, images, DOCX, pages web) sont interroges par une IA francaise Mistral, sur une infrastructure hebergee en France chez OVHcloud. Espaces cloisonnes par client, roles et acces revocables, questions illimitees, aucune donnee transferee hors Union europeenne.",
        "offers": [
          { "@type": "Offer", "name": "Decouverte", "price": "0", "priceCurrency": "EUR" },
          { "@type": "Offer", "name": "Particulier", "price": "9", "priceCurrency": "EUR" },
          { "@type": "Offer", "name": "Pro", "price": "29", "priceCurrency": "EUR" }
        ],
        "featureList": [
          "Espaces cloisonnes par client ou projet, avec roles lecture seule ou edition",
          "Acces revocable a tout moment, avec delai de securite avant reinvitation",
          "Ingestion de PDF, images, pages web, DOCX, TXT, Markdown, avec OCR par vision IA sur les scans",
          "Reponses IA sourcees, questions illimitees sur tous les paliers",
          "Recherche web auto-hebergee, sans traceur ni cle API tierce",
          "Hebergement en France chez OVHcloud, hors champ du CLOUD Act americain",
          "Moteur d'IA francais (Mistral AI), aucune requete hors Union europeenne",
          "Documents et questions jamais utilises pour entrainer un modele",
          "Transcription audio executee sur notre propre infrastructure",
          "Authentification Google SSO et verification en deux etapes (2FA)",
          "Sauvegardes automatiques par espace, restaurables par un administrateur"
        ]
      }
