<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fbf9ff" />

    <title>Open RAG - Chat IA sur vos documents, par espace client</title>
    <meta
      name="description"
      content="Un espace cloisonne par client ou dossier, acces revocable, questions illimitees, cout fixe des 9EUR/mois. Cabinets, agences et equipes projet interrogent leurs documents (PDF, scans, DOCX, pages web) avec des reponses IA sourcees."
    />
    <meta name="robots" content="index, follow" />

    <!--
      TODO avant mise en production : remplacez REPLACE_WITH_YOUR_DOMAIN par
      votre nom de domaine reel dans og:url, twitter:image (si ajoutee) et
      dans public/sitemap.xml. Ces valeurs sont laissees vides/relatives ici
      pour ne pas publier une URL inventee.
    -->
    <link rel="canonical" href="/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Open RAG" />
    <meta property="og:title" content="Open RAG - Chat IA sur vos documents, par espace client" />
    <meta
      property="og:description"
      content="Un espace cloisonne par client ou dossier, acces revocable, questions illimitees, cout fixe des 9EUR/mois. Deposez vos documents, obtenez des reponses IA sourcees, partagez avec le role de votre choix."
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Open RAG - Chat IA sur vos documents, par espace client" />
    <meta
      name="twitter:description"
      content="Un espace cloisonne par client ou dossier, questions illimitees, cout fixe des 9EUR/mois. Pense pour les cabinets, agences et equipes qui gerent plusieurs clients."
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Open RAG",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Any (self-hosted via Docker) ou hebergement gere",
        "description": "Open RAG connecte vos documents (PDF, scans, images, DOCX, pages web) a une IA avec reponses sourcees, dans des espaces cloisonnes par client ou par dossier. Roles et acces revocables, questions illimitees sur tous les paliers, cout fixe qui ne bouge pas avec l'usage.",
        "offers": [
          { "@type": "Offer", "name": "Decouverte", "price": "0", "priceCurrency": "EUR" },
          { "@type": "Offer", "name": "Particulier", "price": "9", "priceCurrency": "EUR" },
          { "@type": "Offer", "name": "Pro", "price": "29", "priceCurrency": "EUR" }
        ],
        "featureList": [
          "Espaces cloisonnes par client ou projet, avec roles lecture seule ou edition",
          "Acces revocable a tout moment, avec delai de securite avant reinvitation",
          "Ingestion de PDF, images, pages web, DOCX, TXT, Markdown, avec OCR par vision IA sur les scans",
          "Reponses IA sourcees, questions illimitees sur tous les paliers",
          "Recherche web auto-hebergee, sans traceur ni cle API tierce",
          "Authentification Google SSO et verification en deux etapes (2FA)",
          "Sauvegardes automatiques par espace, restaurables par un administrateur"
        ]
      }
    </script>
  </head>
  <body class="bg-surface-0 text-slate-900">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
