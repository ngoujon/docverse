# Cache-Control is decided here rather than with a per-location add_header
# on purpose. In nginx, an add_header inside a location block REPLACES the
# whole inherited set from the server block instead of adding to it - so
# the three cache-control locations below used to silently strip every
# security header (CSP, HSTS, X-Content-Type-Options, ...) from exactly
# the responses that need them most: the SPA's HTML and its JS bundles.
# A map keeps all add_header directives in the server block, where they
# apply to every response, and lets caching stay per-URL.
map $uri $hy_cache_control {
    default                                                    "no-cache, no-store, must-revalidate";
    # Vite adds a content hash to asset filenames (app.abc123.js), so a
    # given URL's bytes never change and can be cached forever.
    "~*\.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$" "public, immutable, max-age=31536000";
}

server {
    listen 80;
    server_name _;
    client_max_body_size 200M;

    # Real client IP behind the edge proxy. In production this container is
    # never reached directly: the edge (Caddy, or a system nginx on a
    # shared VPS) terminates TLS and forwards over the internal Docker
    # network, so $remote_addr is the proxy's container IP and would be
    # identical for every visitor - which silently collapsed all of the
    # backend's per-IP rate limits (login, register, password reset, chat,
    # contact form) into a single shared bucket, letting one abusive
    # client lock everyone else out. Only private ranges are trusted here,
    # and only the Docker networks this stack runs on can reach port 80
    # (the published port is bound to 127.0.0.1), so a client can't forge
    # its way into being trusted.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.0/8;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    root /usr/share/nginx/html;
    index index.html;

    # Every prerendered marketing route (scripts/prerender.mjs writes
    # dist/tarifs/index.html, dist/faq/index.html, etc.) is a real
    # directory on disk, so a request for e.g. /tarifs (no trailing slash)
    # hits nginx's automatic directory redirect. That redirect builds an
    # ABSOLUTE Location using $scheme - and $scheme here is "http", because
    # this container never sees TLS directly: Caddy terminates it and
    # forwards over the internal Docker network (see the real-IP comment
    # below). Without this, every public page except "/" 301-redirects
    # through an insecure http:// hop before landing on the https trailing-
    # slash URL - undermining the canonical tags in <head> and adding an
    # extra redirect for every crawler and visitor. A relative Location
    # (just the path) sidesteps the scheme entirely.
    absolute_redirect off;

    # Don't advertise the exact nginx version to scanners.
    server_tokens off;

    # --- Security headers ------------------------------------------------
    # Defense in depth: also set at the edge proxy when it's Caddy, but the
    # edge is a plain reverse proxy on some deployments, so these have to
    # be correct here and are simply passed through.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    # Explicitly 0 rather than "1; mode=block": the legacy XSS auditor is
    # removed from every current browser and, where it survives, its
    # filtering has itself been a source of vulnerabilities. CSP below is
    # the real control.
    add_header X-XSS-Protection "0" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    # The app loads no third-party script, font, style or frame: everything
    # is bundled and served from this origin, and outbound integrations
    # (OAuth providers) are full-page redirects rather than embedded
    # scripts - so 'self' is not an approximation here.
    # connect-src is the single exception: the audience measurement
    # collector (VITE_ANALYTICS_ENDPOINT's origin, filled in at build time
    # by scripts/prerender.mjs) receives beacons sent by our own bundled
    # module (no vendor script is loaded), and only after the visitor
    # opts in.
    # 'unsafe-inline' remains only for styles (Tailwind/React inline style
    # attributes); script-src has no inline escape hatch, which is what
    # actually stops an injected <script> from running.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'__ANALYTICS_ORIGIN__; worker-src 'self' blob:; object-src 'none'; frame-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" always;

    add_header Cache-Control $hy_cache_control always;

    # Enable gzip compression for text-based assets
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json image/svg+xml;
    gzip_comp_level 6;
    gzip_disable "msie6";

    # Requests carrying an encoded path-traversal sequence are never
    # legitimate here (nginx decodes and normalises %2e%2e/ before matching
    # a location, so this catches what normalisation would otherwise hide).
    location ~ (?:\.\./|%2e%2e|%252e) {
        return 400;
    }

    # Pages removed when Docverse went fully free - keep old links and
    # indexed URLs landing somewhere useful instead of on the SPA fallback.
    location ~ ^/cgv/?$ { return 301 /cgu; }
    location ~ ^/entreprise/?$ { return 301 /tarifs; }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # The backend sets the same headers itself (so they're present even
        # if it's ever reached directly). Dropping the upstream copies here
        # keeps exactly one of each on the wire instead of duplicates that
        # confuse scanners and browsers.
        # Including its CSP: the backend sends a stricter, API-specific one
        # (default-src 'none'), but two Content-Security-Policy headers on
        # one response make browsers enforce the intersection and make
        # scanners report a duplicate. The server-level policy above is
        # already restrictive enough for a JSON response, so keep just it.
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Cache-Control;
        proxy_hide_header Pragma;
        proxy_hide_header Expires;

        # Streaming (SSE) support for the chat endpoint
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
