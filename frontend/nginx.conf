server {
    listen 80;
    server_name _;
    client_max_body_size 200M;

    # Real client IP behind the edge proxy. In production this container is
    # never reached directly: Caddy terminates TLS and forwards over the
    # internal Docker network, so $remote_addr is Caddy's container IP and
    # would be identical for every visitor - which silently collapsed all
    # of the backend's per-IP rate limits (login, register, password reset,
    # chat, contact form) into a single shared bucket, letting one abusive
    # client lock everyone else out. Only private ranges are trusted here,
    # and only the Docker networks this stack runs on can reach port 80
    # (the published port is bound to 127.0.0.1), so a client can't forge
    # its way into being trusted.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.0/8;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers (defense in depth; also set at the edge proxy)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Enable gzip compression for text-based assets
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json image/svg+xml;
    gzip_comp_level 6;
    gzip_disable "msie6";

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Streaming (SSE) support for the chat endpoint
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Cache for Vite-hashed assets (CSS, JS, images)
    # Vite adds content hash to filenames (e.g. app.abc123.js), making them immutable
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header ETag '"w/$request_uri"';
    }

    # HTML pages: always check for updates, never cache
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location / {
        try_files $uri $uri/ /index.html;
        # index.html should not be cached
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
}
