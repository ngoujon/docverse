# Project name pinned explicitly (rather than derived from the folder
# name) so renaming the local checkout never orphans the existing named
# volumes (app_data holds the real SQLite DB and the Whisper model)
# - Docker Compose scopes volume names by project name.
name: docverse

services:
  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080/
      - UWSGI_WORKERS=2
      - UWSGI_THREADS=2

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      searxng:
        condition: service_started
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080
      - MAX_UPLOAD_MB=${MAX_UPLOAD_MB:-50}
      - SECRET_KEY=${SECRET_KEY:-}
      - USER_TOKEN_TTL_DAYS=${USER_TOKEN_TTL_DAYS:-30}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - FRONTEND_BASE_URL=${FRONTEND_BASE_URL:-http://localhost:3000}
      - CONTACT_EMAIL=${CONTACT_EMAIL:-}
      - CAPTCHA_DIFFICULTY=${CAPTCHA_DIFFICULTY:-5}
      # Audio transcription (self-hosted via faster-whisper) - model is
      # downloaded once into the app_data volume on first use.
      - WHISPER_MODEL_SIZE=${WHISPER_MODEL_SIZE:-small}
      - WHISPER_COMPUTE_TYPE=${WHISPER_COMPUTE_TYPE:-int8}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_USE_TLS=${SMTP_USE_TLS:-true}
      - SMTP_FROM=${SMTP_FROM:-Docverse <no-reply@docverse.local>}
      # --- IA : Mistral AI (unique fournisseur) --------------------------
      # Chat, vision et embeddings passent tous par l'API Mistral, operee
      # en France. Sans MISTRAL_API_KEY, le chat et l'indexation de
      # documents echouent : c'est desormais une dependance dure.
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      - MISTRAL_BASE_URL=${MISTRAL_BASE_URL:-https://api.mistral.ai}
      - MISTRAL_CHAT_MODEL=${MISTRAL_CHAT_MODEL:-mistral-large-latest}
      - MISTRAL_VISION_MODEL=${MISTRAL_VISION_MODEL:-mistral-medium-latest}
      - MISTRAL_EMBED_MODEL=${MISTRAL_EMBED_MODEL:-mistral-embed}
      - LLM_MAX_CONCURRENCY=${LLM_MAX_CONCURRENCY:-8}
      # --- Marque (permet de renommer le produit sans toucher au code) ---
      - BRAND_NAME=${BRAND_NAME:-Docverse}
      - BRAND_DOMAIN=${BRAND_DOMAIN:-localhost}
      - LEGAL_EMAIL_FOOTER=${LEGAL_EMAIL_FOOTER:-}
      - HOSTING_COUNTRY=${HOSTING_COUNTRY:-France}
      - HOSTING_PROVIDER=${HOSTING_PROVIDER:-OVHcloud}
      # SSO (Google/Microsoft/Apple): a provider is only offered on the
      # login/register pages once its client id is set.
      - BACKEND_BASE_URL=${BACKEND_BASE_URL:-http://localhost:8000}
      - GOOGLE_OAUTH_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID:-}
      - GOOGLE_OAUTH_CLIENT_SECRET=${GOOGLE_OAUTH_CLIENT_SECRET:-}
      - APPLE_OAUTH_CLIENT_ID=${APPLE_OAUTH_CLIENT_ID:-}
      - APPLE_OAUTH_TEAM_ID=${APPLE_OAUTH_TEAM_ID:-}
      - APPLE_OAUTH_KEY_ID=${APPLE_OAUTH_KEY_ID:-}
      - APPLE_OAUTH_PRIVATE_KEY=${APPLE_OAUTH_PRIVATE_KEY:-}
      - GITHUB_OAUTH_CLIENT_ID=${GITHUB_OAUTH_CLIENT_ID:-}
      - GITHUB_OAUTH_CLIENT_SECRET=${GITHUB_OAUTH_CLIENT_SECRET:-}
      - LINKEDIN_OAUTH_CLIENT_ID=${LINKEDIN_OAUTH_CLIENT_ID:-}
      - LINKEDIN_OAUTH_CLIENT_SECRET=${LINKEDIN_OAUTH_CLIENT_SECRET:-}
    volumes:
      - app_data:/app/data
      # Bind-mount the source so backend code edits are picked up live by
      # --reload below, without rebuilding the image.
      - ./backend/app:/app/app
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - VITE_API_PROXY_TARGET=http://backend:8000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

volumes:
  app_data:
  frontend_node_modules:
