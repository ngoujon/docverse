# Project name pinned explicitly (rather than derived from the folder
# name) so renaming the local checkout never orphans the existing named
# volumes (app_data holds the real SQLite DB, ollama_data the pulled
# models) - Docker Compose scopes volume names by project name.
name: hyaides

services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    # Uncomment to use an NVIDIA GPU (requires the NVIDIA Container Toolkit):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080/
      - UWSGI_WORKERS=2
      - UWSGI_THREADS=2

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
      searxng:
        condition: service_started
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_CHAT_MODEL=${OLLAMA_CHAT_MODEL:-llama3.1:8b}
      - OLLAMA_VISION_MODEL=${OLLAMA_VISION_MODEL:-llava:7b}
      - OLLAMA_EMBED_MODEL=${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      # Ollama Cloud (https://ollama.com): when OLLAMA_CLOUD_API_KEY is set,
      # chat + vision transparently switch to the hosted models below for
      # more reactive responses - embeddings always stay local (the cloud
      # API has no /api/embeddings).
      - OLLAMA_CLOUD_API_KEY=${OLLAMA_CLOUD_API_KEY:-}
      - OLLAMA_CLOUD_BASE_URL=${OLLAMA_CLOUD_BASE_URL:-https://ollama.com}
      - OLLAMA_CLOUD_CHAT_MODEL=${OLLAMA_CLOUD_CHAT_MODEL:-gpt-oss:20b}
      - OLLAMA_CLOUD_VISION_MODEL=${OLLAMA_CLOUD_VISION_MODEL:-qwen3.5}
      - SEARXNG_BASE_URL=http://searxng:8080
      - MAX_UPLOAD_MB=${MAX_UPLOAD_MB:-50}
      - OLLAMA_MAX_CONCURRENCY=${OLLAMA_MAX_CONCURRENCY:-1}
      - SECRET_KEY=${SECRET_KEY:-}
      - USER_TOKEN_TTL_DAYS=${USER_TOKEN_TTL_DAYS:-30}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - FRONTEND_BASE_URL=${FRONTEND_BASE_URL:-http://localhost:3000}
      - CONTACT_EMAIL=${CONTACT_EMAIL:-}
      - CAPTCHA_DIFFICULTY=${CAPTCHA_DIFFICULTY:-5}
      # Audio transcription (self-hosted via faster-whisper) - model is
      # downloaded once into the app_data volume on first use.
      - WHISPER_MODEL_SIZE=${WHISPER_MODEL_SIZE:-small}
      - WHISPER_COMPUTE_TYPE=${WHISPER_COMPUTE_TYPE:-int8}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_USE_TLS=${SMTP_USE_TLS:-true}
      - SMTP_FROM=${SMTP_FROM:-Hyaides <no-reply@hyaides.local>}
      # Mistral: prepared, not yet wired to a live provider switch - see
      # TODO.md Phase 3.
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      # SSO (Google/Microsoft/Apple): a provider is only offered on the
      # login/register pages once its client id is set.
      - BACKEND_BASE_URL=${BACKEND_BASE_URL:-http://localhost:8000}
      - GOOGLE_OAUTH_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID:-}
      - GOOGLE_OAUTH_CLIENT_SECRET=${GOOGLE_OAUTH_CLIENT_SECRET:-}
      - APPLE_OAUTH_CLIENT_ID=${APPLE_OAUTH_CLIENT_ID:-}
      - APPLE_OAUTH_TEAM_ID=${APPLE_OAUTH_TEAM_ID:-}
      - APPLE_OAUTH_KEY_ID=${APPLE_OAUTH_KEY_ID:-}
      - APPLE_OAUTH_PRIVATE_KEY=${APPLE_OAUTH_PRIVATE_KEY:-}
      - GITHUB_OAUTH_CLIENT_ID=${GITHUB_OAUTH_CLIENT_ID:-}
      - GITHUB_OAUTH_CLIENT_SECRET=${GITHUB_OAUTH_CLIENT_SECRET:-}
      - LINKEDIN_OAUTH_CLIENT_ID=${LINKEDIN_OAUTH_CLIENT_ID:-}
      - LINKEDIN_OAUTH_CLIENT_SECRET=${LINKEDIN_OAUTH_CLIENT_SECRET:-}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - STRIPE_PRICE_PARTICULIER=${STRIPE_PRICE_PARTICULIER:-}
      - STRIPE_PRICE_PRO=${STRIPE_PRICE_PRO:-}
    volumes:
      - app_data:/app/data
      # Bind-mount the source so backend code edits are picked up live by
      # --reload below, without rebuilding the image.
      - ./backend/app:/app/app
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - VITE_API_PROXY_TARGET=http://backend:8000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

volumes:
  ollama_data:
  app_data:
  frontend_node_modules:
